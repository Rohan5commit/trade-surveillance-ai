name: Load Test

on:
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install locust==2.32.2
      - name: Start API
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
      - name: Run locust headless
        run: |
          locust -f scripts/load/locustfile.py --host http://localhost:8000 --headless -u 100 -r 10 -t 2m --csv load_results
      - name: Upload load report
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            load_results_stats.csv
            load_results_failures.csv
