name: Drift Monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Drift check
        env:
          BASELINE_URL: ${{ secrets.BASELINE_FEATURES_URL }}
          CURRENT_URL: ${{ secrets.CURRENT_FEATURES_URL }}
        run: |
          if [ -z "$BASELINE_URL" ] || [ -z "$CURRENT_URL" ]; then
            echo "Drift URLs not set; skipping"
            exit 0
          fi
          curl -L "$BASELINE_URL" -o baseline.csv
          curl -L "$CURRENT_URL" -o current.csv
          python scripts/drift_monitor.py --baseline baseline.csv --current current.csv --psi-threshold 0.25 > drift_report.json
          cat drift_report.json
      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift_report.json
