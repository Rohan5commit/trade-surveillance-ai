name: Scheduled Retrain

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Retrain model
        env:
          DATASET_URL: ${{ secrets.RETRAIN_DATASET_URL }}
        run: |
          if [ -z "$DATASET_URL" ]; then
            echo "RETRAIN_DATASET_URL not set; skipping retrain"
            exit 0
          fi
          curl -L "$DATASET_URL" -o retrain.csv
          python scripts/retrain.py --dataset retrain.csv --model-name svm_market_abuse
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrained-models
          path: models/
