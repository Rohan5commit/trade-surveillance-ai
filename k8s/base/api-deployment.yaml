apiVersion: apps/v1
kind: Deployment
metadata:
  name: surveillance-api
  namespace: trade-surveillance
spec:
  replicas: 3
  selector:
    matchLabels:
      app: surveillance-api
  template:
    metadata:
      labels:
        app: surveillance-api
    spec:
      containers:
      - name: api
        image: ghcr.io/rohan5commit/trade-surveillance-ai:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: surveillance-config
        - secretRef:
            name: surveillance-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
