apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: surveillance-default-deny
  namespace: trade-surveillance
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: trade-surveillance
  egress:
  - {}
